[project]
name = "fable-resolver"
version = "0.7.0"
description = "HTTP-based service for resolving entity pseudonyms leveraging Master Patient Indices in a privacy-preserving record linkage context."
authors = [
    {name = "Maximilian Jugl"},
    {name = "Paul Brassel", email = "paul.brassel@medizin.uni-leipzig.de"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard] (>=0.165.0,<0.166.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "fable-model (>=0.5.0,<0.6.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "fable-client (>=0.11.0,<0.12.0)",
    "redis (>=8.1.0,<9.0.0)",
    "fastapi-utils[all] (>=0.8.0,<0.9.0)",
    "pyyaml (>=6.0.4,<7.0.0)",
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
keywords = ["record linkage", "service", "api", "privacy", "bloom filter"]

[project.urls]
repository = "https://github.com/ul-mds/fable-resolver"

[project.optional-dependencies]
mosaic = ["mosaic-python-client (>=0.3.0,<0.4.0)"]

[project.scripts]
fable-resolver = "fable_resolver.main:run_server"

[tool.poetry]
packages = [{ include = "fable_resolver" }]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
env_files = [
    ".env.test"
]
env_override_existing_values = 1

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "faker (>=40.23.0,<41.0.0)",
    "ruff (>=0.15.16,<0.16.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "readme-coverage-badger (>=1.1.0,<2.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "starlette (>=1.10.0,<2.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)"
]
